<script>
function download(scale){
  var status=document.getElementById('status'); status.textContent='Rendering…';
  var svg=document.querySelector('#banner svg').cloneNode(true);
  var W=1584*scale, H=396*scale;
  svg.setAttribute('width', W); svg.setAttribute('height', H);
  var xml=new XMLSerializer().serializeToString(svg);
  var blob=new Blob([xml], {type:'image/svg+xml;charset=utf-8'});
  var url=URL.createObjectURL(blob);
  var img=new Image();
  img.onload=function(){
    var c=document.createElement('canvas'); c.width=W; c.height=H;
    var ctx=c.getContext('2d'); ctx.drawImage(img,0,0,W,H);
    URL.revokeObjectURL(url);
    var a=document.createElement('a');
    a.download='David Silverlight - LinkedIn Banner'+(scale>1?' @'+scale+'x':'')+'.png';
    a.href=c.toDataURL('image/png');
    document.body.appendChild(a); a.click(); a.remove();
    status.textContent='Downloaded ✓ ('+W+' × '+H+')';
  };
  img.onerror=function(){ status.textContent='Render failed — try the other size.'; };
  img.src=url;
}
</script>
